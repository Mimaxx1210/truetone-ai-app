<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LA TEAM — TrueTone AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF8F4;
    --surface: #FFFFFF;
    --surface2: #F5F1EB;
    --border: #E8DFD3;
    --border-light: #F0E9DD;
    --bordeaux: #8B3A3A;
    --bordeaux-light: #A85555;
    --bordeaux-pale: #F5E8E5;
    --bordeaux-line: #E8C9C0;
    --chocolat: #2C1810;
    --chocolat-mid: #5C4438;
    --chocolat-muted: #8C7569;
    --corail: #C97B5A;
    --vert: #7BA382;
    --vert-pale: #EAF1EA;
    --or: #C9A44A;
    /* Dégradé signature des 5 carnations */
    --grad-carnations: linear-gradient(100deg, #3B2417 0%, #5A3520 22%, #8B5A2B 46%, #B07A45 70%, #D2A679 100%);
    --radius: 20px;
    --radius-lg: 28px;
    --shadow: 0 2px 20px rgba(44, 24, 16, 0.05);
    --shadow-lg: 0 8px 40px rgba(44, 24, 16, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--chocolat);
    font-family: 'Jost', sans-serif;
    font-size: 15px; font-weight: 300;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- En-tête ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border-light);
    position: sticky; top: 0; z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(145deg, var(--corail), var(--bordeaux));
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; box-shadow: 0 2px 12px rgba(139, 58, 58, 0.20);
  }
  .logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 500; letter-spacing: 0.06em;
    color: var(--chocolat);
  }
  .logo-text span { color: var(--bordeaux); font-style: italic; }
  .back-link {
    font-size: 12.5px; font-weight: 400; color: var(--bordeaux);
    text-decoration: none; letter-spacing: 0.03em;
    display: flex; align-items: center; gap: 5px;
  }
  .back-link:active { opacity: 0.6; }

  /* ---------- Conteneur ---------- */
  main { max-width: 560px; margin: 0 auto; padding: 20px 18px 40px; }
  .screen { display: none; animation: fade 0.35s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- États de chargement / message ---------- */
  .center-msg {
    text-align: center; padding: 60px 24px; color: var(--chocolat-muted);
  }
  .center-msg .big { font-size: 40px; margin-bottom: 16px; }
  .center-msg h2 {
    font-family: 'Cormorant Garamond', serif; font-weight: 500;
    font-size: 25px; color: var(--chocolat); margin-bottom: 10px;
  }
  .center-msg p { font-size: 14px; line-height: 1.7; max-width: 320px; margin: 0 auto; }
  .spinner {
    width: 30px; height: 30px; margin: 0 auto 20px;
    border: 3px solid var(--border); border-top-color: var(--bordeaux);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Bandeau profil (accueil) ---------- */
  .profil-bar {
    display: flex; align-items: stretch; gap: 10px; margin-bottom: 22px;
  }
  .stat {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 10px; text-align: center;
    box-shadow: var(--shadow);
  }
  .stat .val {
    font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600;
    color: var(--bordeaux); line-height: 1;
  }
  .stat .lbl {
    font-size: 10.5px; font-weight: 400; color: var(--chocolat-muted);
    letter-spacing: 0.08em; text-transform: uppercase; margin-top: 6px;
  }
  .stat .val small { font-size: 15px; }

  /* ---------- Carte copine / brief ---------- */
  .brief-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px 22px; margin-bottom: 22px;
    box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
  }
  .brief-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: var(--grad-carnations);
  }
  .brief-copine {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
  }
  .copine-badge {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--grad-carnations);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600;
    flex-shrink: 0; box-shadow: 0 2px 10px rgba(44,24,16,0.15);
  }
  .copine-meta .nom {
    font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600;
    color: var(--chocolat);
  }
  .copine-meta .carn {
    font-size: 11.5px; color: var(--chocolat-muted); letter-spacing: 0.05em;
    text-transform: uppercase; margin-top: 2px;
  }
  .brief-event {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 17px; color: var(--bordeaux); margin-bottom: 12px;
  }
  .brief-text {
    font-size: 14px; line-height: 1.75; color: var(--chocolat-mid);
  }

  /* ---------- Pastilles de manches ---------- */
  .manches-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .manche-tile {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; text-align: left;
    width: 100%; font-family: 'Jost', sans-serif; cursor: pointer;
    transition: all 0.2s; box-shadow: var(--shadow);
  }
  .manche-tile.ouverte:active { transform: scale(0.98); border-color: var(--bordeaux-line); }
  .manche-tile.verrouillee { opacity: 0.55; cursor: default; }
  .manche-tile.terminee { background: var(--vert-pale); border-color: #CBDFCB; cursor: default; }
  .manche-icon {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
    background: var(--surface2);
  }
  .manche-tile.terminee .manche-icon { background: var(--vert); color: #fff; }
  .manche-tile.ouverte .manche-icon { background: var(--bordeaux-pale); }
  .manche-body { flex: 1; }
  .manche-body .titre { font-size: 14.5px; font-weight: 500; color: var(--chocolat); }
  .manche-body .sub { font-size: 12px; color: var(--chocolat-muted); margin-top: 3px; }
  .manche-chevron { color: var(--chocolat-muted); font-size: 18px; }

  /* ---------- Boutons ---------- */
  .btn-primary {
    width: 100%; padding: 16px; border: none; border-radius: 16px;
    background: var(--chocolat); color: #fff;
    font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-ghost {
    background: none; border: none; color: var(--bordeaux);
    font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 400;
    letter-spacing: 0.04em; cursor: pointer; padding: 12px;
  }

  /* ---------- Écran manche / question ---------- */
  .q-transition {
    background: var(--surface2); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 22px;
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 16px; line-height: 1.6; color: var(--chocolat-mid);
  }
  .q-progress {
    font-size: 11.5px; color: var(--chocolat-muted); letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 12px; text-align: center;
  }
  .q-context {
    font-size: 16px; line-height: 1.7; color: var(--chocolat);
    margin-bottom: 24px; font-weight: 400;
  }
  .options { display: flex; flex-direction: column; gap: 11px; }
  .option {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 15px 17px; text-align: left;
    font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 300;
    line-height: 1.5; color: var(--chocolat-mid); cursor: pointer;
    transition: all 0.18s; width: 100%;
  }
  .option:active { transform: scale(0.99); }
  .option:hover { border-color: var(--bordeaux-line); }
  .option.correct { border-color: var(--vert); background: var(--vert-pale); color: var(--chocolat); }
  .option.wrong { border-color: var(--bordeaux-light); background: var(--bordeaux-pale); }
  .option:disabled { cursor: default; }

  /* ---------- Révélation ---------- */
  .reveal {
    margin-top: 24px; border-radius: var(--radius); padding: 22px 20px;
    animation: fade 0.4s ease;
  }
  .reveal.ok { background: var(--vert-pale); border: 1px solid #CBDFCB; }
  .reveal.ko { background: var(--bordeaux-pale); border: 1px solid var(--bordeaux-line); }
  .reveal-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .reveal-verdict {
    font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600;
  }
  .reveal.ok .reveal-verdict { color: var(--vert); }
  .reveal.ko .reveal-verdict { color: var(--bordeaux); }
  .reveal-pts {
    margin-left: auto; font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 600; color: var(--chocolat);
  }
  .reveal-text { font-size: 14.5px; line-height: 1.75; color: var(--chocolat-mid); margin-bottom: 14px; }
  .reveal-geste {
    background: rgba(255,255,255,0.6); border-radius: 12px; padding: 13px 15px;
    font-size: 13.5px; line-height: 1.6; color: var(--chocolat);
  }
  .reveal-geste b {
    display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--chocolat-muted); margin-bottom: 5px;
  }
  .reveal-produit {
    display: inline-block; margin-top: 14px; padding: 11px 18px;
    background: var(--bordeaux); color: #fff; border-radius: 12px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.04em;
    text-decoration: none;
  }

  /* ---------- Fin de manche / mission ---------- */
  .celebrate { text-align: center; padding: 40px 24px; }
  .celebrate .medal { font-size: 56px; margin-bottom: 18px; }
  .celebrate h2 {
    font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 600;
    color: var(--bordeaux); margin-bottom: 12px;
  }
  .celebrate .score-big {
    font-family: 'Cormorant Garamond', serif; font-size: 52px; font-weight: 600;
    color: var(--chocolat); line-height: 1; margin: 20px 0 8px;
  }
  .celebrate .score-lbl {
    font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--chocolat-muted); margin-bottom: 24px;
  }
  .reward-row {
    display: flex; justify-content: center; gap: 14px; margin-bottom: 28px; flex-wrap: wrap;
  }
  .reward-chip {
    background: var(--surface2); border-radius: 14px; padding: 12px 18px;
    font-size: 13px; color: var(--chocolat); font-weight: 400;
  }
  .reward-chip b { color: var(--bordeaux); font-weight: 600; }

  /* ---------- Progression ---------- */
  .prog-section { margin-bottom: 28px; }
  .prog-section h3 {
    font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600;
    color: var(--chocolat); margin-bottom: 14px;
  }
  .bar-row { margin-bottom: 14px; }
  .bar-label {
    display: flex; justify-content: space-between; font-size: 13px;
    color: var(--chocolat-mid); margin-bottom: 6px;
  }
  .bar-label b { color: var(--chocolat); font-weight: 500; }
  .bar-track { height: 8px; background: var(--surface2); border-radius: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 8px; background: var(--bordeaux); transition: width 0.6s ease; }
  .bar-fill.conf { background: var(--grad-carnations); }

  .foot-note {
    text-align: center; font-size: 11.5px; color: var(--chocolat-muted);
    letter-spacing: 0.03em; margin-top: 8px; padding: 16px;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--chocolat); color: #fff; padding: 13px 22px;
    border-radius: 14px; font-size: 13.5px; box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 50;
    max-width: 88%; text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">💄</div>
    <div class="logo-text">LA <span>TEAM</span></div>
  </div>
  <a class="back-link" href="index.html">← Rosy</a>
</header>

<main>
  <!-- Chargement initial -->
  <section class="screen active" id="screen-loading">
    <div class="center-msg">
      <div class="spinner"></div>
      <p>On prépare ta journée…</p>
    </div>
  </section>

  <!-- Accueil -->
  <section class="screen" id="screen-home"></section>

  <!-- Manche en cours -->
  <section class="screen" id="screen-manche"></section>

  <!-- Célébration (fin manche / mission) -->
  <section class="screen" id="screen-celebrate"></section>

  <!-- Progression -->
  <section class="screen" id="screen-prog"></section>

  <!-- État vide / erreur -->
  <section class="screen" id="screen-empty"></section>
</main>

<div class="toast" id="toast"></div>

<script>
  /* ================= Configuration ================= */
  const API = 'https://8linsgnquk.execute-api.us-east-1.amazonaws.com/prod';
  const SESSION_KEY = 'rosy_session';   // clé partagée avec index.html (même origine)

  const COPINE_INITIALE = { awa:'A', nadia:'N', soso:'S', mimi:'M', melissa:'M' };
  const CARN_LIBELLE = {
    ebene:'Ébène', cacao:'Cacao', caramel:'Caramel', miel:'Miel', beige_dore:'Beige Doré'
  };

  /* ================= État local (affichage seul) ================= */
  let etatMoi = null;      // dernier GET /cercle/moi
  let etatMission = null;  // dernier GET /cercle/mission
  let mancheCourante = null;
  let idxQuestion = 0;

  /* ================= Jeton & appels API ================= */
  function lireJeton() {
    try {
      const brut = localStorage.getItem(SESSION_KEY);
      if (!brut) return null;
      const obj = JSON.parse(brut);
      return obj.token || null;
    } catch (e) { return null; }
  }

  function versConnexion() {
    // Auth gérée par l'app principale : on y renvoie proprement.
    window.location.href = 'index.html';
  }

  async function apiGet(route) {
    const token = lireJeton();
    if (!token) { versConnexion(); throw new Error('no-token'); }
    const res = await fetch(API + route, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (res.status === 401 || res.status === 403) { versConnexion(); throw new Error('unauth'); }
    return { status: res.status, data: await res.json() };
  }

  async function apiPost(route, body) {
    const token = lireJeton();
    if (!token) { versConnexion(); throw new Error('no-token'); }
    const res = await fetch(API + route, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.status === 401 || res.status === 403) {
      // 403 peut aussi être une manche verrouillée : on lit le corps avant de trancher.
      let data = null; try { data = await res.json(); } catch(e){}
      if (data && data.error === 'manche_verrouillee') return { status: 403, data };
      versConnexion(); throw new Error('unauth');
    }
    return { status: res.status, data: await res.json() };
  }

  /* ================= Utilitaires d'affichage ================= */
  function montrer(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }
  const LIBELLE_MANCHE = { M1:'Manche du matin', M2:'Manche du midi', M3:'Manche du soir' };

  /* ================= Chargement initial ================= */
  async function initialiser() {
    try {
      const [moi, mission] = await Promise.all([
        apiGet('/cercle/moi'),
        apiGet('/cercle/mission')
      ]);
      etatMoi = moi.data;
      if (mission.status === 404) { etatMission = null; }
      else { etatMission = mission.data; }
      rendreAccueil();
    } catch (e) {
      if (e.message === 'no-token' || e.message === 'unauth') return; // redirigé
      rendreErreur();
    }
  }

  /* ================= Écran : accueil ================= */
  function rendreAccueil() {
    const p = etatMoi.profil;
    const auj = etatMoi.aujourdhui;
    const el = document.getElementById('screen-home');

    // Pas de mission publiée
    if (!etatMission) {
      el.innerHTML = profilBarHTML(p) + `
        <div class="center-msg">
          <div class="big">🌙</div>
          <h2>Pas de mission aujourd'hui</h2>
          <p>Reviens demain : une nouvelle copine aura besoin de toi.</p>
        </div>
        <button class="btn-ghost" style="width:100%" onclick="ouvrirProgression()">Voir ma progression</button>`;
      montrer('screen-home');
      return;
    }

    const m = etatMission;
    const carnLib = CARN_LIBELLE[m.carnation] || m.carnation || '';
    let manchesHTML = '';
    ['M1','M2','M3'].forEach(code => {
      const etat = auj.manches[code];   // verrouillee | ouverte | terminee
      const cls = etat;
      let icon = '🔒', sub = 'Verrouillée';
      if (etat === 'ouverte') { icon = '▶'; sub = 'À jouer maintenant'; }
      if (etat === 'terminee') { icon = '✓'; sub = 'Terminée'; }
      if (etat === 'verrouillee' && m.deverrouillages && m.deverrouillages[code]) {
        sub = 'Se déverrouille à ' + m.deverrouillages[code];
      }
      const onclick = etat === 'ouverte' ? ` onclick="ouvrirManche('${code}')"` : '';
      manchesHTML += `
        <button class="manche-tile ${cls}"${onclick}>
          <div class="manche-icon">${icon}</div>
          <div class="manche-body">
            <div class="titre">${esc(LIBELLE_MANCHE[code])}</div>
            <div class="sub">${esc(sub)}</div>
          </div>
          ${etat === 'ouverte' ? '<div class="manche-chevron">›</div>' : ''}
        </button>`;
    });

    const initiale = COPINE_INITIALE[m.copine] || (m.copine_libelle||'?')[0];
    el.innerHTML = `
      ${profilBarHTML(p)}
      <div class="brief-card">
        <div class="brief-copine">
          <div class="copine-badge">${esc(initiale)}</div>
          <div class="copine-meta">
            <div class="nom">${esc(m.copine_libelle)}</div>
            <div class="carn">Carnation ${esc(carnLib)}</div>
          </div>
        </div>
        <div class="brief-event">${esc(m.evenement)}</div>
        <div class="brief-text">${esc(m.brief_du_jour)}</div>
      </div>
      <div class="manches-list">${manchesHTML}</div>
      <button class="btn-ghost" style="width:100%" onclick="ouvrirProgression()">Voir ma progression</button>
      <div class="foot-note">La mission change à minuit, heure de Paris.</div>`;
    montrer('screen-home');
  }

  function profilBarHTML(p) {
    return `
      <div class="profil-bar">
        <div class="stat">
          <div class="val">${p.serie.jours}<small>🔥</small></div>
          <div class="lbl">Série</div>
        </div>
        <div class="stat">
          <div class="val">${p.perles}</div>
          <div class="lbl">Perles</div>
        </div>
        <div class="stat">
          <div class="val" style="font-size:19px">${esc(p.niveau_libelle)}</div>
          <div class="lbl">${p.xp} XP</div>
        </div>
      </div>`;
  }

  /* ================= Écran : manche ================= */
  function ouvrirManche(code) {
    const manche = etatMission.manches.find(x => x.manche === code);
    if (!manche) return;
    mancheCourante = manche;
    // Reprendre à la première question non répondue
    idxQuestion = manche.questions.findIndex(q => !q.resultat);
    if (idxQuestion === -1) idxQuestion = 0;
    rendreQuestion();
  }

  function rendreQuestion() {
    const manche = mancheCourante;
    const q = manche.questions[idxQuestion];
    const total = manche.questions.length;
    const el = document.getElementById('screen-manche');

    const transHTML = (idxQuestion === 0 && manche.transition)
      ? `<div class="q-transition">${esc(manche.transition)}</div>` : '';

    let optionsHTML = '';
    q.options.forEach((opt, i) => {
      optionsHTML += `<button class="option" data-i="${i}" onclick="repondre(${i})">${esc(opt)}</button>`;
    });

    el.innerHTML = `
      ${transHTML}
      <div class="q-progress">${esc(LIBELLE_MANCHE[manche.manche])} · Question ${idxQuestion+1} / ${total}</div>
      <div class="q-context">${esc(q.context || q.contexte)}</div>
      <div class="options" id="optionsWrap">${optionsHTML}</div>
      <div id="revealWrap"></div>`;
    montrer('screen-manche');

    // Si déjà répondue (reprise de session), on ré-affiche le résultat verrouillé
    if (q.resultat) afficherReveal(q.resultat, true);
  }

  async function repondre(choix) {
    const q = mancheCourante.questions[idxQuestion];
    if (q.resultat) return; // déjà répondue

    document.querySelectorAll('#optionsWrap .option').forEach(b => b.disabled = true);
    try {
      const r = await apiPost('/cercle/reponse', {
        date: etatMission.date, sk: q.sk, choix: choix
      });
      if (r.status === 403 && r.data.error === 'manche_verrouillee') {
        toast(r.data.message);
        document.querySelectorAll('#optionsWrap .option').forEach(b => b.disabled = false);
        return;
      }
      const d = r.data;
      q.resultat = {
        choix: choix, correcte: d.correcte, points: d.points,
        bonne_reponse: d.bonne_reponse, revelation: d.revelation,
        geste_appris: d.geste_appris, produit_ref: d.produit_ref, lien_awin: d.lien_awin
      };
      // Mémoriser l'état renvoyé pour la célébration éventuelle
      mancheCourante._dernier = d;
      afficherReveal(q.resultat, false);
    } catch (e) {
      if (e.message === 'no-token' || e.message === 'unauth') return;
      toast('Oups, réessaie dans un instant.');
      document.querySelectorAll('#optionsWrap .option').forEach(b => b.disabled = false);
    }
  }

  function afficherReveal(res, reprise) {
    // Colorer les options
    document.querySelectorAll('#optionsWrap .option').forEach(b => {
      b.disabled = true;
      const i = parseInt(b.dataset.i, 10);
      if (i === res.bonne_reponse) b.classList.add('correct');
      else if (i === res.choix && !res.correcte) b.classList.add('wrong');
    });

    const dernier = mancheCourante.questions.length - 1;
    const estDerniere = idxQuestion === dernier;
    const produitHTML = res.lien_awin
      ? `<a class="reveal-produit" href="${esc(res.lien_awin)}" target="_blank" rel="noopener">Découvrir ${esc(res.produit_ref || 'le produit')} →</a>`
      : '';

    const btn = estDerniere
      ? `<button class="btn-primary" style="margin-top:20px" onclick="finManche()">Voir le bilan de la manche</button>`
      : `<button class="btn-primary" style="margin-top:20px" onclick="questionSuivante()">Question suivante</button>`;

    document.getElementById('revealWrap').innerHTML = `
      <div class="reveal ${res.correcte ? 'ok' : 'ko'}">
        <div class="reveal-head">
          <span class="reveal-verdict">${res.correcte ? 'Bien vu' : 'Pas tout à fait'}</span>
          <span class="reveal-pts">+${res.points}</span>
        </div>
        <div class="reveal-text">${esc(res.revelation)}</div>
        <div class="reveal-geste"><b>Le geste à retenir</b>${esc(res.geste_appris)}</div>
        ${produitHTML}
      </div>
      ${btn}`;
    document.getElementById('revealWrap').scrollIntoView({ behavior:'smooth', block:'center' });
  }

  function questionSuivante() {
    idxQuestion++;
    rendreQuestion();
  }

  /* ================= Fin de manche / mission ================= */
  async function finManche() {
    // On recharge l'état serveur (source de vérité) pour série, perles, manches.
    try {
      const [moi, mission] = await Promise.all([
        apiGet('/cercle/moi'), apiGet('/cercle/mission')
      ]);
      etatMoi = moi.data;
      etatMission = mission.status === 404 ? null : mission.data;
    } catch (e) {
      if (e.message === 'no-token' || e.message === 'unauth') return;
    }

    const d = mancheCourante._dernier || {};
    const el = document.getElementById('screen-celebrate');
    const missionFinie = d.mission && d.mission.terminee;
    const parfaite = d.manche && d.manche.parfaite;

    let medal, titre, rewards = '';
    if (missionFinie) {
      medal = '🏆'; titre = 'Mission accomplie !';
      rewards += `<div class="reward-chip">Points du jour ×2 : <b>${etatMoi.aujourdhui.points_jour}</b></div>`;
    } else if (parfaite) {
      medal = '✨'; titre = 'Manche parfaite !';
    } else {
      medal = '🎯'; titre = 'Manche terminée';
    }
    rewards += `<div class="reward-chip">Perles : <b>${etatMoi.profil.perles}</b></div>`;
    rewards += `<div class="reward-chip">Série : <b>${etatMoi.profil.serie.jours} 🔥</b></div>`;

    const suite = missionFinie
      ? `<p class="score-lbl">Rendez-vous demain pour une nouvelle copine.</p>`
      : '';

    el.innerHTML = `
      <div class="celebrate">
        <div class="medal">${medal}</div>
        <h2>${titre}</h2>
        <div class="score-big">${etatMoi.aujourdhui.points_jour}</div>
        <div class="score-lbl">points aujourd'hui</div>
        <div class="reward-row">${rewards}</div>
        ${suite}
        <button class="btn-primary" onclick="retourAccueil()">Retour à l'accueil</button>
        <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="ouvrirProgression()">Voir ma progression</button>
      </div>`;
    montrer('screen-celebrate');
  }

  function retourAccueil() { rendreAccueil(); }

  /* ================= Écran : progression ================= */
  async function ouvrirProgression() {
    try {
      const moi = await apiGet('/cercle/moi');
      etatMoi = moi.data;
    } catch (e) {
      if (e.message === 'no-token' || e.message === 'unauth') return;
    }
    const el = document.getElementById('screen-prog');
    let compHTML = '';
    etatMoi.competences.forEach(c => {
      compHTML += `
        <div class="bar-row">
          <div class="bar-label"><b>${esc(c.libelle)}</b><span>${c.maitrise_pct}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${c.maitrise_pct}%"></div></div>
        </div>`;
    });
    let confHTML = '';
    etatMoi.confiance.forEach(c => {
      const badge = c.badge ? ' 🏅' : '';
      confHTML += `
        <div class="bar-row">
          <div class="bar-label"><b>${esc(c.libelle)}${badge}</b><span>${c.jauge_pct}%</span></div>
          <div class="bar-track"><div class="bar-fill conf" style="width:${c.jauge_pct}%"></div></div>
        </div>`;
    });
    el.innerHTML = `
      ${profilBarHTML(etatMoi.profil)}
      <div class="prog-section">
        <h3>Mes savoir-faire</h3>
        ${compHTML}
      </div>
      <div class="prog-section">
        <h3>La confiance des copines</h3>
        ${confHTML}
      </div>
      <button class="btn-primary" onclick="retourAccueil()">Retour à l'accueil</button>`;
    montrer('screen-prog');
  }

  /* ================= Écran : erreur ================= */
  function rendreErreur() {
    document.getElementById('screen-empty').innerHTML = `
      <div class="center-msg">
        <div class="big">🌸</div>
        <h2>Un petit souci</h2>
        <p>On n'arrive pas à charger ta journée. Vérifie ta connexion et réessaie.</p>
        <button class="btn-primary" style="max-width:240px;margin:24px auto 0" onclick="location.reload()">Réessayer</button>
      </div>`;
    montrer('screen-empty');
  }

  /* ================= Démarrage ================= */
  initialiser();
</script>
</body>
</html>
